# TEMPORARY (removed before merge): measures the Node 24 V8 WebAssembly abort in the PGlite suite.
name: V8 stress (temporary)
on:
  pull_request:
permissions:
  contents: read
jobs:
  stress:
    name: stress ${{ matrix.variant }} \#${{ matrix.rep }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [node24-baseline, node24-no-wasm-code-gc, node22, node26]
        rep: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ startsWith(matrix.variant, 'node24') && '24.22.2' || (matrix.variant == 'node22' && '22' || '26') }}
          cache: npm
      - run: npm ci
      - name: Run the PGlite suite and record V8 aborts
        env:
          FLAGS: ${{ matrix.variant == 'node24-no-wasm-code-gc' && '--no-wasm-code-gc' || '' }}
        run: |
          node -v
          set +e
          npx tsx $FLAGS --test --test-concurrency=1 test/*.test.ts > suite.log 2>&1
          rc=$?
          set -e
          aborts=$(grep -c 'Check failed' suite.log || true)
          echo "RESULT variant=${{ matrix.variant }} node=$(node -v) rc=$rc v8_aborts=$aborts"
          grep -B2 -A3 'Check failed' suite.log || true
          tail -15 suite.log
          exit $rc
