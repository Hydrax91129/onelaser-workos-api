name: API checks

on:
  # Pull requests run here; pushes only for main, so a branch with an open PR is not checked twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Three independent jobs run at the same time (about 5 minutes instead of 10 in a row).
# Branch protection requires the check named "verify": that job only passes when all three pass,
# so keep its name. Each job has its own throwaway database; nothing is shared between jobs.
jobs:
  test-embedded:
    name: test (embedded PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Test DingTalk export parser with fictional records
        run: python3 -m unittest discover -s test -p 'prepare_okr_xlsx_test.py'
      - name: Test pinned Wiki input safety patch
        run: node --test test/wiki-safety.test.mjs
      - name: Test read-only sent reply sync
        run: python3 -m unittest discover -s tools/support -p "*_test.py"
      - name: Test with embedded PostgreSQL
        run: npm test

  test-postgres:
    name: test (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: workos_ci
          POSTGRES_PASSWORD: ephemeral-ci-password
          POSTGRES_DB: workos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workos_ci -d workos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Test PostgreSQL adapter
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://workos_ci:ephemeral-ci-password@127.0.0.1:5432/workos_test

  docker:
    name: production image
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: workos_ci
          POSTGRES_PASSWORD: ephemeral-ci-password
          POSTGRES_DB: workos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workos_ci -d workos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build production image with pinned frontend
        # The optional repository secret _GITHUB_FETCH_TOKEN (GitHub rejects secret names that start with
        # GITHUB_) lets the build download the frontend and Wiki once those repositories are private. It
        # reaches the build as the BuildKit secret GITHUB_FETCH_TOKEN, not as a build arg.
        env:
          FETCH_TOKEN: ${{ secrets['_GITHUB_FETCH_TOKEN'] }}
        run: docker build --secret id=GITHUB_FETCH_TOKEN,env=FETCH_TOKEN -t workos-ci .
      - name: Verify private import CLI is included in the production image
        run: docker run --rm --entrypoint node workos-ci build/src/cli/import-okr.js --help
      - name: Test canonical redirect with production Caddy
        run: |
          set -euo pipefail
          caddy_container="$(docker create workos-ci)"
          trap 'docker rm -f "$caddy_container" >/dev/null 2>&1 || true' EXIT
          mkdir -p "$RUNNER_TEMP/workos-caddy"
          docker cp "$caddy_container:/usr/bin/caddy" "$RUNNER_TEMP/workos-caddy/caddy"
          chmod +x "$RUNNER_TEMP/workos-caddy/caddy"
          CADDY_BIN="$RUNNER_TEMP/workos-caddy/caddy" node --import tsx --test test/caddy-redirect.test.ts
      - name: Check same-origin production container
        run: |
          docker run --detach --name workos-smoke --network host --cap-drop=ALL \
            -e PORT=18689 -e NODE_ENV=production \
            -e APP_PUBLIC_URL=https://workos.example.test \
            -e WORKOS_TEAM_MODE=company \
            -e AI_REVIEW_MODE=bot \
            -e GROK_BOT_MCP_AUTH_MODE=oauth \
            -e DATABASE_URL=postgres://workos_ci:ephemeral-ci-password@127.0.0.1:5432/workos_test \
            workos-ci
          node tools/smoke-container.mjs
      - name: Container diagnostics
        if: failure()
        run: docker logs workos-smoke 2>/dev/null || true
      - name: Stop smoke container
        if: always()
        run: docker rm -f workos-smoke 2>/dev/null || true

  verify:
    runs-on: ubuntu-latest
    needs: [test-embedded, test-postgres, docker]
    if: always()
    steps:
      - name: All checks passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || { echo "A required job did not succeed."; exit 1; }; done
