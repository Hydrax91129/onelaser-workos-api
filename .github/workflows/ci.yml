name: API checks

on:
  # Pull requests run here; pushes only for main, so a branch with an open PR is not checked twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The jobs run at the same time. Branch protection requires the check named "verify": that job only passes when
# all the others pass, so keep its name. Each job has its own throwaway database; nothing is shared between jobs.
#
# Faster releases (owner, 2026-11-13):
# - Tests are split into 4 groups per database (tools/test-shard.mjs), each on its own machine. The "changes" job
#   first checks that every test file is in exactly one group, so a new file cannot be left out.
# - A pull request whose only change is deploy/frontend-revision.txt (the automatic frontend pin) skips the test
#   groups: the backend code is the same as main, which was fully tested. It still builds the production image with
#   that frontend and starts it (the "production image" job). Pushes to main always run every test group.
#   Anything uncertain (another event, a diff error, any other file) runs everything.
#
# Why `npm test` runs `tsx --no-wasm-code-gc ...` (package.json):
# PGlite is PostgreSQL compiled to WebAssembly, and most test files open one, in the PostgreSQL 16 job as well.
# Node 24's V8 (13.6) has a race in WebAssembly code garbage collection: a wasm-to-JS wrapper that the code GC
# is already freeing can be freed a second time, and V8 aborts the test file with
#   # Check failed: jit_page.has_value().    or    # Check failed: jit_page_->allocations_.erase(addr) == 1.
# Upstream: https://github.com/nodejs/node/issues/66366 (V8 fix 9b8ca54d5a, crbug 409379692, shipped in Node 26).
# The Node 24 backport, https://github.com/nodejs/node/pull/66376, is not in any release yet (24.22.3 has no V8
# change), so pinning another Node 24 patch does not help.
# --no-wasm-code-gc stops V8 from freeing dead wasm code, which removes the race. It only applies to test
# processes: each test file is its own short-lived process, so the code that is kept costs little memory.
# Production runs `node build/src/server.js` against real PostgreSQL without it. It cannot go in NODE_OPTIONS
# (Node only allows a short list of V8 flags there), so it is on the command line; node --test passes it on
# to each test file's process. Node 22 and 26 accept it too. Remove it once a Node 24 release has the backport.
# Every reported abort stack runs through WasmEngine::FreeDeadCode, the code GC this flag turns off. Measured here
# (PR #136, full suite per run): Node 24.22.2 without the flag aborted 2 of 32 times, with it 0 of 32; Node 22 and
# Node 26 0 of 16 each. That alone is not conclusive (the abort is rare); upstream measured 16 aborts without it, 0 with it.
jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      pin_only: ${{ steps.diff.outputs.pin_only }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Every test file is in exactly one test group
        run: node tools/test-shard.mjs --check 4
      - name: Is this pull request only a frontend pin?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pin_only=false
          if [ "$EVENT" = pull_request ] && [ -n "$BASE" ] && [ -n "$HEAD" ]; then
            if files="$(git diff --name-only "$BASE...$HEAD")" && [ "$files" = "deploy/frontend-revision.txt" ]; then
              pin_only=true
            fi
          fi
          echo "Changed files: ${files:-(not a pull request)}"
          echo "pin_only=$pin_only"
          echo "pin_only=$pin_only" >> "$GITHUB_OUTPUT"

  test-embedded:
    name: test (embedded PostgreSQL, ${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.pin_only != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
        if: matrix.shard == 1
      - name: Test DingTalk export parser with fictional records
        if: matrix.shard == 1
        run: python3 -m unittest discover -s test -p 'prepare_okr_xlsx_test.py'
      - name: Test pinned Wiki input safety patch
        if: matrix.shard == 1
        run: node --test test/wiki-safety.test.mjs
      - name: Test read-only sent reply sync
        if: matrix.shard == 1
        run: python3 -m unittest discover -s tools/support -p "*_test.py"
      - name: Test with embedded PostgreSQL (group ${{ matrix.shard }} of 4)
        run: node tools/test-shard.mjs ${{ matrix.shard }}/4

  test-postgres:
    name: test (PostgreSQL 16, ${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.pin_only != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: workos_ci
          POSTGRES_PASSWORD: ephemeral-ci-password
          POSTGRES_DB: workos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workos_ci -d workos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Test PostgreSQL adapter (group ${{ matrix.shard }} of 4)
        run: node tools/test-shard.mjs ${{ matrix.shard }}/4
        env:
          TEST_DATABASE_URL: postgres://workos_ci:ephemeral-ci-password@127.0.0.1:5432/workos_test

  docker:
    name: production image
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: workos_ci
          POSTGRES_PASSWORD: ephemeral-ci-password
          POSTGRES_DB: workos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workos_ci -d workos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build production image with pinned frontend
        # The optional repository secret _GITHUB_FETCH_TOKEN (GitHub rejects secret names that start with
        # GITHUB_) lets the build download the frontend and Wiki once those repositories are private. It
        # reaches the build as the BuildKit secret GITHUB_FETCH_TOKEN, not as a build arg.
        env:
          FETCH_TOKEN: ${{ secrets['_GITHUB_FETCH_TOKEN'] }}
        run: docker build --secret id=GITHUB_FETCH_TOKEN,env=FETCH_TOKEN -t workos-ci .
      - name: Verify private import CLI is included in the production image
        run: docker run --rm --entrypoint node workos-ci build/src/cli/import-okr.js --help
      - name: Test canonical redirect with production Caddy
        run: |
          set -euo pipefail
          caddy_container="$(docker create workos-ci)"
          trap 'docker rm -f "$caddy_container" >/dev/null 2>&1 || true' EXIT
          mkdir -p "$RUNNER_TEMP/workos-caddy"
          docker cp "$caddy_container:/usr/bin/caddy" "$RUNNER_TEMP/workos-caddy/caddy"
          chmod +x "$RUNNER_TEMP/workos-caddy/caddy"
          CADDY_BIN="$RUNNER_TEMP/workos-caddy/caddy" node --import tsx --test test/caddy-redirect.test.ts
      - name: Check same-origin production container
        run: |
          docker run --detach --name workos-smoke --network host --cap-drop=ALL \
            -e PORT=18689 -e NODE_ENV=production \
            -e APP_PUBLIC_URL=https://workos.example.test \
            -e WORKOS_TEAM_MODE=company \
            -e AI_REVIEW_MODE=bot \
            -e GROK_BOT_MCP_AUTH_MODE=oauth \
            -e DATABASE_URL=postgres://workos_ci:ephemeral-ci-password@127.0.0.1:5432/workos_test \
            workos-ci
          node tools/smoke-container.mjs
      - name: Container diagnostics
        if: failure()
        run: docker logs workos-smoke 2>/dev/null || true
      - name: Stop smoke container
        if: always()
        run: docker rm -f workos-smoke 2>/dev/null || true

  verify:
    runs-on: ubuntu-latest
    needs: [changes, test-embedded, test-postgres, docker]
    if: always()
    steps:
      - name: All checks passed
        env:
          CHANGES: ${{ needs.changes.result }}
          PIN_ONLY: ${{ needs.changes.outputs.pin_only }}
          TESTS: ${{ needs.test-embedded.result }} ${{ needs.test-postgres.result }}
          IMAGE: ${{ needs.docker.result }}
        run: |
          echo "changes=$CHANGES pin_only=$PIN_ONLY tests=$TESTS image=$IMAGE"
          [ "$CHANGES" = success ] || { echo "The changes check did not succeed."; exit 1; }
          [ "$IMAGE" = success ] || { echo "The production image job did not succeed."; exit 1; }
          for r in $TESTS; do
            [ "$r" = success ] && continue
            # Test groups may be skipped only for a pull request that changes nothing but the frontend pin.
            [ "$r" = skipped ] && [ "$PIN_ONLY" = true ] && continue
            echo "A test job did not succeed ($r)."; exit 1
          done
