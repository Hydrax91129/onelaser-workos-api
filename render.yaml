# Creates paid infrastructure only after the account holder reviews and applies it.
services:
  - type: web
    name: onelaser-workos
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    repo: https://github.com/Yonge6/onelaser-workos-api
    branch: main
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: checksPass
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOW_DEV_LOGIN
        value: 'false'
      - key: SEED_DEMO
        value: 'false'
      - key: FRONTEND_CONNECTED
        value: 'true'
      - key: WORKOS_TEAM_MODE
        value: company
      - key: WORKOS_TEAM_NAME
        value: OneLaser
      - key: AI_REVIEW_MODE
        value: bot
      - key: GROK_BOT_MCP_AUTH_MODE
        value: oauth
      - key: DATABASE_URL
        fromDatabase:
          name: onelaser-workos-db
          property: connectionString
      - key: DINGTALK_CLIENT_ID
        sync: false
      - key: DINGTALK_CLIENT_SECRET
        sync: false
      - key: DINGTALK_CORP_ID
        sync: false
      - key: DINGTALK_ALLOWED_DEPARTMENT_IDS
        sync: false
      - key: DINGTALK_MANAGER_USER_IDS
        sync: false
      - key: DINGTALK_NOTIFICATIONS_ENABLED
        value: 'false'
      # Optional email sign-in codes and invite emails for members outside DingTalk (Resend).
      # Without these, invites still work: the admin copies the link; invitees sign in with email + password.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Optional object storage for uploaded files (RMA photos, task attachments, feedback screenshots).
      # Unset = files stay in PostgreSQL, as before. To switch: create a PRIVATE bucket and a key limited to it,
      # set the five S3_* values, run `node build/src/cli/check-file-storage.js` in the Shell, then FILE_STORAGE=s3.
      # Alibaba Cloud OSS Hong Kong: S3_ENDPOINT=https://oss-cn-hongkong.aliyuncs.com, S3_REGION=oss-cn-hongkong.
      # Cloudflare R2: S3_ENDPOINT=https://<account>.r2.cloudflarestorage.com, S3_REGION=auto, S3_FORCE_PATH_STYLE=true.
      # Keep the S3_* values while any file lives in the bucket, even if FILE_STORAGE goes back to db.
      - key: FILE_STORAGE
        value: db
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # Configure GROK_BOT_OAUTH_REDIRECT_URIS only after verifying the client
      # request or official client metadata; no allowlist is enabled by default.
      # Optional exact local client-ID pin: GROK_BOT_OAUTH_PRE_REGISTERED_CLIENT_ID.
      # OAuth discovery/consent can be enabled before the Routine webhook settings.
      # Add webhook URL/secret/allowed host before requesting actual assessments.
      # Missing settings disable assessment; they never enable developer authentication.
      # Optional API fallback: AI_REVIEW_MODE=api, AI_PROVIDER_API_KEY, AI_MODEL_ID.
      # Optional notifications: DINGTALK_AGENT_ID and the explicit enable switch.
databases:
  - name: onelaser-workos-db
    plan: 0.1c-256mb
    region: singapore
    postgresMajorVersion: '16'
    diskSizeGB: 1
    storageAutoscalingEnabled: false
    databaseName: workos
    user: workos
    ipAllowList: []
